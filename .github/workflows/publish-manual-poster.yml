name: Publish uploaded poster

on:
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: "论文 arXiv 号，例如 2609.30441"
        required: true
        type: string
      filename:
        description: "已上传到 data/posters/manual/ 的 PNG 或 JPG 文件名"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Register uploaded image
        env:
          POSTER_ARXIV_ID: ${{ inputs.arxiv_id }}
          POSTER_FILENAME: ${{ inputs.filename }}
        run: python tools/manual_posters.py --arxiv-id "$POSTER_ARXIV_ID" --filename "$POSTER_FILENAME"

      - name: Build site
        run: |
          python -m pip install -r requirements-static.txt
          python build_static.py --output-dir site

      - name: Commit poster listing
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish uploaded poster"
          file_pattern: "data/posters/manual data/posters/current/manifest.json"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
