name: Update agenda data

on:
  schedule:
    # 07:00 Friday in Asia/Shanghai; GitHub Actions cron uses UTC.
    - cron: "0 23 * * 4"
  workflow_dispatch:
    inputs:
      no_summaries:
        description: "Only refresh agenda JSON, skip paper summaries"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-fetch.txt
          python -m pip install -r requirements-static.txt
          git clone --depth 1 https://github.com/USTC-Astro/coffee_break_poster.git /tmp/coffee_break_poster
          python -m pip install -e /tmp/coffee_break_poster
          python -m playwright install --with-deps chromium

      - name: Refresh Benty agenda
        env:
          BENTY_PASSWORD: ${{ secrets.BENTY_PASSWORD }}
        run: |
          if [ -z "$BENTY_PASSWORD" ]; then
            echo "BENTY_PASSWORD is not configured; skipping agenda refresh."
            exit 0
          fi
          if [ "${{ github.event.inputs.no_summaries }}" = "true" ]; then
            python fetch_benty.py --output-dir data --no-summaries
          else
            python fetch_benty.py --output-dir data
          fi

      - name: Generate coffee-break posters
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CBP_CMD: python /tmp/coffee_break_poster/tools/cbp.py
          PYTHONPATH: /tmp/coffee_break_poster
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured; skipping poster generation."
            exit 0
          fi
          python tools/generate_cbp_posters.py --all-current

      - name: Rebuild static manifests
        run: python build_static.py --output-dir site

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coffee-break agenda"
          file_pattern: "data"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
