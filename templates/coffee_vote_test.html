<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Coffee Vote Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2eb;
    --surface: #ffffff;
    --border: #ddd8ce;
    --border2: #c8c2b5;
    --accent: #1a56a0;
    --text: #1a1a1a;
    --muted: #6b6560;
    --coffee: #6f4e37;
    --ok: #207245;
    --bad: #b23b2c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", sans-serif;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--text);
    padding: 1.2rem 3rem;
  }
  .site-title {
    font-family: "Source Serif 4", serif;
    font-size: 1.7rem;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
  }
  .site-title span { color: var(--accent); }
  .nav-tabs {
    background: #e8e4dc;
    border-bottom: 1px solid var(--border);
    padding: 0 3rem;
    display: flex;
    overflow-x: auto;
  }
  .nav-tab {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.75rem;
    padding: 0.7rem 1.2rem;
    text-decoration: none;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .nav-tab.active { color: var(--coffee); border-bottom-color: var(--coffee); }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem;
  }
  h1 {
    font-family: "Source Serif 4", serif;
    font-size: 1.55rem;
    margin-bottom: 0.4rem;
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    line-height: 1.55;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .row {
    display: grid;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  input {
    width: 100%;
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 0.65rem 0.75rem;
    font: inherit;
  }
  button {
    border: 0;
    border-radius: 5px;
    background: var(--coffee);
    color: #fff;
    padding: 0.75rem 0.9rem;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.78rem;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .status {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  .records {
    display: grid;
    gap: 0.55rem;
  }
  .record {
    border-top: 1px solid var(--border);
    padding-top: 0.55rem;
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.45;
  }
  .record strong { color: var(--text); }
  code {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.82em;
    background: #ebe5da;
    padding: 0.08rem 0.22rem;
    border-radius: 3px;
  }
  @media (max-width: 700px) {
    header { padding: 1rem 1.2rem; }
    .nav-tabs { padding: 0 1.2rem; }
    main { padding: 1.2rem 1rem 3rem; }
  }
</style>
</head>
<body>
<header>
  <a class="site-title" href="/">USTC <span>Astro</span> Coffee</a>
</header>
<div class="nav-tabs">
  <a class="nav-tab" href="/">📄 论文</a>
  <a class="nav-tab" href="/coffee_vote">☕ 咖啡投票</a>
  <a class="nav-tab" href="/poster">🖼 海报</a>
  <a class="nav-tab active" href="/coffee_vote_test">Supabase Test</a>
</div>

<main>
  <h1>Supabase 手机连通性测试</h1>
  <p class="sub">
    这个页面只测试 Supabase 是否适合作为 coffee vote 后端。正式投票仍然使用当前 Cloudflare Worker。
    第一次测试前，请先在 Supabase SQL Editor 里运行 <code>supabase/coffee_vote_test.sql</code>。
  </p>

  <section class="panel">
    <div class="row">
      <input id="tester-name" maxlength="30" placeholder="你的名字或设备名（可选）">
      <input id="tester-note" maxlength="80" placeholder="备注：如 iPhone 5G / 微信 / 校园网">
    </div>
    <div class="row">
      <button id="connect-btn" onclick="testConnection()">测试连接</button>
      <button id="write-btn" onclick="writeTest()">写入一条测试记录</button>
      <button class="secondary" id="read-btn" onclick="readRecords()">读取最近记录</button>
    </div>
    <div class="status" id="status">等待测试。</div>
  </section>

  <section class="panel">
    <div class="records" id="records"></div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://nhogiteotdxwzfuwhpll.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YsX1wgA9YBM-9HkDKgNMHw_2GUAZyxF';
const TABLE = 'coffee_vote_test';

function headers(extra = {}) {
  return {
    apikey: SUPABASE_KEY,
    Authorization: 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    ...extra,
  };
}

function setStatus(message, kind = '') {
  const box = document.getElementById('status');
  box.textContent = message;
  box.className = 'status' + (kind ? ' ' + kind : '');
}

async function request(path, options = {}, timeoutMs = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  const started = performance.now();
  try {
    const response = await fetch(SUPABASE_URL + path, {
      cache: 'no-store',
      ...options,
      signal: controller.signal,
    });
    const text = await response.text();
    const ms = Math.round(performance.now() - started);
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    return {ok: response.ok, status: response.status, ms, text, data};
  } catch (error) {
    return {ok: false, status: 0, ms: Math.round(performance.now() - started), error: error.name};
  } finally {
    clearTimeout(timer);
  }
}

async function testConnection() {
  document.getElementById('connect-btn').disabled = true;
  setStatus('连接中...');
  const result = await request('/rest/v1/', {headers: headers()}, 10000);
  document.getElementById('connect-btn').disabled = false;
  if (result.ok || result.status === 404 || result.status === 406) {
    setStatus(`Supabase 可以访问。HTTP ${result.status}，耗时 ${result.ms} ms。`, 'ok');
  } else {
    setStatus(`Supabase 连接失败。HTTP ${result.status || '-'}，耗时 ${result.ms} ms，错误 ${result.error || result.text || 'unknown'}。`, 'bad');
  }
}

async function writeTest() {
  document.getElementById('write-btn').disabled = true;
  const name = document.getElementById('tester-name').value.trim() || 'anonymous';
  const note = document.getElementById('tester-note').value.trim() || 'supabase smoke test';
  setStatus('写入中...');
  const result = await request('/rest/v1/' + TABLE, {
    method: 'POST',
    headers: headers({Prefer: 'return=representation'}),
    body: JSON.stringify({
      name,
      note,
      user_agent: navigator.userAgent,
    }),
  }, 12000);
  document.getElementById('write-btn').disabled = false;
  if (result.ok) {
    setStatus(`写入成功。HTTP ${result.status}，耗时 ${result.ms} ms。`, 'ok');
    readRecords();
  } else {
    setStatus(`写入失败。HTTP ${result.status || '-'}，耗时 ${result.ms} ms。\n${result.text || result.error || ''}`, 'bad');
  }
}

async function readRecords() {
  document.getElementById('read-btn').disabled = true;
  const result = await request('/rest/v1/' + TABLE + '?select=id,name,note,created_at&order=created_at.desc&limit=8', {
    headers: headers(),
  }, 10000);
  document.getElementById('read-btn').disabled = false;
  if (!result.ok) {
    setStatus(`读取失败。HTTP ${result.status || '-'}，耗时 ${result.ms} ms。\n${result.text || result.error || ''}`, 'bad');
    return;
  }
  const records = Array.isArray(result.data) ? result.data : [];
  document.getElementById('records').innerHTML = records.length
    ? records.map((row) => `
        <div class="record">
          <strong>${escapeHtml(row.name || 'anonymous')}</strong>
          <div>${escapeHtml(row.note || '')}</div>
          <div>${escapeHtml(new Date(row.created_at).toLocaleString())}</div>
        </div>
      `).join('')
    : '<div class="record">暂无记录。</div>';
  setStatus(`读取成功。HTTP ${result.status}，耗时 ${result.ms} ms。`, 'ok');
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;',
  }[char]));
}

document.addEventListener('DOMContentLoaded', testConnection);
</script>
</body>
</html>
